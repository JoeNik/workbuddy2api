services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    networks:
      - default
      - wb-net

networks:
  wb-net:
    external: true
    name: wb-net
